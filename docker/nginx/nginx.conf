worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;  # the API emits structured access logs with request ids

    # Docker's embedded DNS returns one A record per API replica; nginx
    # round-robins across all of them.
    upstream api {
        server api:8000;
        # Reuse upstream connections instead of a TCP handshake per request.
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # Retry idempotent requests on another replica if one is restarting.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
