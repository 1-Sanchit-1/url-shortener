worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;  # the API emits structured access logs with request ids

    # Docker's embedded DNS returns one A record per API replica. Without
    # `resolve`, nginx looks the name up once at startup and never again: after
    # the replicas were recreated, all traffic went to whichever old IP still
    # answered (one replica at 100% CPU, the other idle). Re-resolving every 5s
    # tracks replicas as they are replaced or scaled.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api {
        zone api_upstream 64k;
        server api:8000 resolve;
        # Reuse upstream connections instead of a TCP handshake per request.
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # Retry idempotent requests on another replica if one is restarting.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
