services:
  # Entry point: load-balances across API replicas on :8000.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api

  api:
    build: .
    environment: &app-env
      APP_ENVIRONMENT: dev
      APP_DATABASE_URL: postgresql+asyncpg://shortener:shortener@postgres:5432/shortener
      APP_REDIS_URL: redis://redis:6379/0
      APP_LOG_FORMAT: json
      APP_ACCESS_LOG_SAMPLE_RATE: "${ACCESS_LOG_SAMPLE_RATE:-0.1}"
      # One process per container; scale by adding replicas (see metrics.py).
      WEB_CONCURRENCY: "1"
      # Trust X-Forwarded-For from nginx so rate limits see the real client IP.
      # Only safe because the API port is not published outside this network.
      FORWARDED_ALLOW_IPS: "*"
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Consumes the click stream and writes batches to PostgreSQL. Scale with
  # `docker compose up --scale worker=3`; the consumer group splits the stream.
  worker:
    build: .
    environment: *app-env
    command: ["python", "-m", "app.workers.click_consumer"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # One-shot job: apply migrations before the API starts accepting traffic.
  migrate:
    build: .
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # Docker's default 64 MB /dev/shm is too small for parallel query and parallel
    # VACUUM on multi-million-row tables ("could not resize shared memory segment").
    shm_size: 512mb
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    # pg_stat_statements is loaded so query hot spots can be profiled under load.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # volatile-lru evicts only keys that carry a TTL (cache entries, rate-limit buckets),
    # so the click-event stream, which has no TTL, is never evicted under memory pressure.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
